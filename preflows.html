<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1C3144">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="images/icon-192.png">
  <title>Preflows — Go With the Flow</title>
  <link rel="stylesheet" href="css/page.css?v=32">
  <link rel="stylesheet" href="css/buttons.css?v=31">
  <link rel="stylesheet" href="css/home.css?v=31">
  <link rel="stylesheet" href="css/sidebar.css?v=31">
  <link rel="stylesheet" href="css/workspace.css?v=38">
  <link rel="stylesheet" href="css/evidence.css?v=32">
  <link rel="stylesheet" href="css/popups.css?v=31">
  <link rel="stylesheet" href="css/phone.css?v=39">
  <link rel="stylesheet" href="css/print.css?v=31">
</head>
<body class="page" data-page="preflows">
  <a class="skip-link" href="#app">Skip to content</a>

  <div id="app" class="home">
    <div class="top-bar">
      <a class="logo" href="index.html">
        <span class="logo-dot">✿</span>
        <span class="logo-text">Go With the Flow</span>
      </a>
      <div class="top-menu">
        <a class="btn plain" href="preflows.html">Preflows</a>
      </div>
    </div>

    <div class="page-body">
      <div class="list-top">
        <div>
          <h1>Preflows</h1>
          <p class="gray-text">Pre-write your arguments</p>
        </div>
        <button type="button" class="btn main" data-action="new-opening">New preflow</button>
      </div>
      <div class="card-list" id="preflow-list"></div>
      <div class="button-row">
        <a class="btn plain" href="index.html">Back</a>
      </div>
    </div>
  </div>

  <div id="new-opening-box" class="popup-cover hide">
    <div class="popup">
      <h2>New preflow</h2>
      <div class="popup-body">
        <label class="form-line"><span>Topic</span><input id="preflow-topic"></label>
        <label class="form-line"><span>Side</span>
          <select id="preflow-side">
            <option value="pro">Aff</option>
            <option value="con">Neg</option>
          </select>
        </label>
      </div>
      <div class="popup-buttons">
        <button type="button" class="btn" data-action="close-dialog">Cancel</button>
        <button type="button" class="btn main" data-action="make-opening">Create</button>
      </div>
    </div>
  </div>

  <div id="edit-preflow-box" class="popup-cover hide">
    <div class="popup">
      <h2>Edit preflow details</h2>
      <div class="popup-body">
        <label class="form-line"><span>Topic</span><input id="edit-preflow-topic"></label>
        <label class="form-line"><span>Side</span>
          <select id="edit-preflow-side">
            <option value="pro">Aff</option>
            <option value="con">Neg</option>
          </select>
        </label>
      </div>
      <div class="popup-buttons">
        <button type="button" class="btn" data-action="close-dialog">Cancel</button>
        <button type="button" class="btn main" data-action="save-preflow-details">Save</button>
      </div>
    </div>
  </div>

  <div id="confirm-box" class="popup-cover hide">
    <div class="popup">
      <h2 id="confirm-title"></h2>
      <div class="popup-body"><p id="confirm-text"></p></div>
      <div class="popup-buttons">
        <button type="button" class="btn" data-action="close-dialog">Cancel</button>
        <button type="button" class="btn main" id="confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <div class="hide" id="sample-pf">
    <div class="card">
      <h2 class="card-name" data-action="open-opening" style="cursor: pointer;"></h2>
      <p class="card-extra"></p>
      <div class="button-row">
        <button type="button" class="btn main" data-action="edit-preflow">Edit details</button>
        <button type="button" class="btn red" data-action="delete-opening">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/common.js?v=70"></script>
  <script src="js/preflows.js?v=40"></script>
</body>
</html>
